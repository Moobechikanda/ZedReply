<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnansiFlow Customer Test</title>
</head>
<body>
  <main>
    <img id="brand-logo" alt="AnansiFlow" width="180">
    <h1>AnansiFlow customer chat</h1>
    <p>No company signup is needed. Open the chat launcher at the bottom left to try the sample business assistant. Its company details are fictional.</p>
  </main>
  <script>
    (function (document, tagName) {
      const baseUrl = window.location.origin;
      document.getElementById('brand-logo').src = `${baseUrl}/brand-assets/zedreply-logo.svg`;
      const script = document.createElement(tagName);
      const firstScript = document.getElementsByTagName(tagName)[0];

      window.chatwootSettings = { position: 'left' };
      window.addEventListener('chatwoot:ready', () => {
        window.$chatwoot.toggle('open');
      }, { once: true });
      script.src = `${baseUrl}/packs/js/sdk.js`;
      script.async = true;
      script.onload = () => window.chatwootSDK.run({
        websiteToken: 'zq8dMMfPZTmHneh5XExdEjUJ',
        baseUrl,
      });
      firstScript.parentNode.insertBefore(script, firstScript);
    })(document, 'script');
  </script>
</body>
</html>
